name: Deploy .NET Backend to Windows VPS

on:
  push:
    branches:
      - main
    paths:
      - 'MyNews.Api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore MyNews.Api/MyNews.Api.csproj

      - name: Build
        run: dotnet build MyNews.Api/MyNews.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish MyNews.Api/MyNews.Api.csproj --configuration Release --output ./publish --no-build

      - name: Zip publish directory
        run: |
          cd publish
          zip -r ../deploy.zip .

      - name: Upload Zip via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: 22
          source: "deploy.zip"
          target: "C:/inetpub/"
          overwrite: true

      - name: Extract Zip and Restart IIS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: 22
          script: |
            powershell -Command "
              Import-Module WebAdministration -ErrorAction SilentlyContinue;
              Stop-WebAppPool -Name 'DefaultAppPool' -ErrorAction SilentlyContinue;
              
              $target = 'C:\inetpub\api';
              $zip = 'C:\inetpub\deploy.zip';
              
              if (Test-Path $target) {
                Remove-Item '$target\*' -Recurse -Force -ErrorAction SilentlyContinue
              } else {
                New-Item -ItemType Directory -Force -Path $target
              }
              
              Expand-Archive -Path $zip -DestinationPath $target -Force;
              Remove-Item $zip -Force -ErrorAction SilentlyContinue;
              
              Start-WebAppPool -Name 'DefaultAppPool' -ErrorAction SilentlyContinue;
            "