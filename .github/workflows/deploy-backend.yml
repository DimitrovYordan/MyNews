name: Deploy .NET Backend to Windows VPS

on:
  push:
    branches:
      - main
    paths:
      - 'MyNews.Api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore MyNews.Api/MyNews.Api.csproj

      - name: Clean & Publish
        run: dotnet publish MyNews.Api/MyNews.Api.csproj --configuration Release --output ./publish

      - name: Stop IIS, Kill Processes & Prepare Directories
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: 22
          script_stop: true
          script: |
            powershell -Command "
              Write-Host '1. Stopping IIS & Killing all .NET backend processes...'
              iisreset /stop
              Get-Process w3wp, dotnet, MyNews.Api -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 3

              $target = 'C:\inetpub\api'
              Write-Host '2. Cleaning target folder...'
              if (Test-Path $target) {
                Get-ChildItem -Path $target -Recurse | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
              } else {
                New-Item -ItemType Directory -Force -Path $target | Out-Null
              }

              Write-Host '3. Re-creating required subdirectories for uncompressed SCP transfer...'
              New-Item -ItemType Directory -Force -Path '$target\runtimes\win-x64\native' | Out-Null
              New-Item -ItemType Directory -Force -Path '$target\runtimes\win\lib\net6.0' | Out-Null
              New-Item -ItemType Directory -Force -Path '$target\wwwroot' | Out-Null

              Write-Host '✅ Server is prepared for raw SCP file transfer.'
            "

      - name: Direct SCP Upload
        run: |
          sshpass -p "${{ secrets.VPS_PASS }}" scp -r -o StrictHostKeyChecking=no ./publish/* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:C:/inetpub/api/

      - name: Start IIS on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: 22
          script_stop: true
          script: |
            powershell -Command "
              Write-Host '1. Starting IIS...'
              iisreset /start

              Write-Host '✅ IIS restarted. New DLL timestamp:'
              Get-ChildItem -Path 'C:\inetpub\api\MyNews.Api.dll' | Select-Object LastWriteTime, Length
            "