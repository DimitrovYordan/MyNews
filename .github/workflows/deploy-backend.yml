name: Deploy .NET Backend to Windows VPS (Debug Mode)

on:
  push:
    branches:
      - main
    paths:
      - 'MyNews.Api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore MyNews.Api/MyNews.Api.csproj

      - name: Build
        run: dotnet build MyNews.Api/MyNews.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish MyNews.Api/MyNews.Api.csproj --configuration Release --output ./publish --no-build

      - name: Compress publish folder
        run: |
          cd publish
          zip -r ../deploy.zip .
          echo "Zip file created successfully."
          ls -lh ../deploy.zip

      - name: STEP 1 - Upload Zip via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: 22
          source: "deploy.zip"
          target: "C:/inetpub"
          overwrite: true

      - name: STEP 2 - Debug & Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: 22
          script_stop: false
          script: |
            powershell -Command "
              $ErrorActionPreference = 'Continue'
              
              Write-Host '--- CHECKING ZIP FILE ---'
              if (Test-Path 'C:\inetpub\deploy.zip') {
                $file = Get-Item 'C:\inetpub\deploy.zip'
                Write-Host ('Found deploy.zip, Size: {0} MB' -f [math]::Round($file.Length / 1MB, 2))
              } else {
                Write-Host '❌ ERROR: C:\inetpub\deploy.zip does not exist!'
                exit 1
              }

              Write-Host '--- STOPPING IIS ---'
              iisreset /stop
              if ($LASTEXITCODE -ne 0) { Write-Host 'iisreset /stop completed with warnings or non-zero exit code.' }

              Write-Host '--- CLEANING TARGET FOLDER ---'
              $target = 'C:\inetpub\api'
              if (Test-Path $target) {
                Get-ChildItem -Path $target -Recurse | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
                Write-Host 'Target folder cleaned.'
              } else {
                New-Item -ItemType Directory -Force -Path $target | Out-Null
                Write-Host 'Created target folder.'
              }

              Write-Host '--- UNZIPPING ARCHIVE ---'
              try {
                Expand-Archive -Path 'C:\inetpub\deploy.zip' -DestinationPath $target -Force
                Write-Host '✅ Successfully unzipped files to C:\inetpub\api'
              } catch {
                Write-Host ('❌ Extract failed: ' + $_.Exception.Message)
                exit 1
              }

              Write-Host '--- REMOVING ZIP ARCHIVE ---'
              Remove-Item 'C:\inetpub\deploy.zip' -Force -ErrorAction SilentlyContinue

              Write-Host '--- STARTING IIS ---'
              iisreset /start
              Write-Host '✅ IIS restarted successfully.'
            "