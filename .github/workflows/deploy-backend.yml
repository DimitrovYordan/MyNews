name: Deploy .NET Backend to Windows VPS

on:
  push:
    branches:
      - main
    paths:
      - 'MyNews.Api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore MyNews.Api/MyNews.Api.csproj

      - name: Build
        run: dotnet build MyNews.Api/MyNews.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish MyNews.Api/MyNews.Api.csproj --configuration Release --output ./publish --no-build

      - name: Compress publish folder
        run: |
          cd publish
          zip -r ../deploy.zip .

      - name: Transfer zip to VPS via native SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: 22
          source: "deploy.zip"
          target: "C:/inetpub"
          overwrite: true

      - name: Extract files and Restart IIS on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: 22
          script_stop: true
          script: |
            powershell -Command "
              Write-Host '1. Stopping IIS...'
              iisreset /stop

              $target = 'C:\inetpub\api'
              $zipFile = 'C:\inetpub\deploy.zip'

              Write-Host '2. Cleaning target folder...'
              if (Test-Path $target) {
                Remove-Item '$target\*' -Recurse -Force -ErrorAction SilentlyContinue
              } else {
                New-Item -ItemType Directory -Force -Path $target | Out-Null
              }

              Write-Host '3. Unzipping new version...'
              if (Test-Path $zipFile) {
                Expand-Archive -Path $zipFile -DestinationPath $target -Force
                Remove-Item $zipFile -Force
                Write-Host '✅ Files extracted successfully.'
              } else {
                Write-Error '❌ Zip file was not found on VPS!'
                exit 1
              }

              Write-Host '4. Starting IIS...'
              iisreset /start
              Write-Host '✅ IIS restarted successfully.'
            "